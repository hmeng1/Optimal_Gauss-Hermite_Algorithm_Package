[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimized-gauss-hermite"
version = "0.1.1"
description = "Optimized Gauss-Hermite quadrature"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Haozhan Meng", email = "hzhmeng@gmail.com"},
]
keywords = ["gauss-hermite", "quadrature", "numerical-integration", "gaussian", "expectation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/hmeng1/Optimal_Gauss-Hermite_Algorithm_Package"
Repository = "https://github.com/hmeng1/Optimal_Gauss-Hermite_Algorithm_Package"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
